{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card-wrap">
    <div class="auth-brand">
      <img src="{{ url_for('static', filename='images/mascot_icon.png') }}" alt="Nexa Pals">
      <h1>Welcome back</h1>
      <p>Log in to continue your coding journey</p>
    </div>

    <div class="auth-card">
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="website" style="display:none;" tabindex="-1" autocomplete="off">

        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-input" placeholder="Enter your username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-yellow" style="width:100%;font-size:1rem;padding:0.85rem;margin-top:0.4rem;">
          Log in <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div class="divider-dark" style="margin:1.4rem 0;"></div>

      <div class="auth-footer">
        Don't have an account?
        <a href="{{ url_for('signup') }}">Sign up free →</a>
      </div>
      <div class="auth-demo">
        Demo: <code>test</code> / <code>test123</code>
      </div>
    </div>
  </div>
</section>
{% endblock %}
