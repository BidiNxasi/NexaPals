{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<section class="auth-page" style="min-height:calc(100vh - 64px);">
  <div class="auth-card-wrap" style="text-align:center;">
    <img src="{{ url_for('static', filename='images/mascot_icon.png') }}" alt="" style="width:96px;height:96px;border-radius:50%;border:3px solid var(--yellow);margin:0 auto 1.2rem;box-shadow:0 0 0 6px rgba(255,179,71,0.15);">
    <h1 style="color:var(--white);font-size:2.2rem;margin:0 0 0.4rem;">Oops — 404</h1>
    <p style="color:var(--mist);margin:0 0 1.5rem;">This page wandered off. Let's get you back on track.</p>
    <a href="{{ url_for('index') }}" class="btn btn-yellow btn-xl"><i class="fas fa-home"></i> Back to Home</a>
  </div>
</section>
{% endblock %}
